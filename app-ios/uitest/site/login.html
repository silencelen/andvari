<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
body { font: 18px -apple-system, sans-serif; margin: 24px; }
label { display: block; margin-top: 16px; }
input { font: inherit; width: 100%; padding: 10px; box-sizing: border-box; }
button { font: inherit; margin-top: 20px; padding: 12px 20px; }
</style>
</head>
<body>
<h1>Sign in</h1>
<form method="post" action="submitted">
<label for="username">Username</label>
<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" aria-label="Username">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" aria-label="Password">
<button id="submit" type="submit">Sign in</button>
</form>
<p><a href="index.html">All test pages</a></p>
</body>
</html>
