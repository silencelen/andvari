<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card field</title>
<style>
body { font: 18px -apple-system, sans-serif; margin: 8px; }
label { display: block; }
input { font: inherit; width: 100%; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>
<!-- One field of the stand-in payment provider's split card form, the way Braintree's and Adyen's frames hold one field
     each: ?kind=number, expiry or code. A fill reaches each sibling frame with its own field only. -->
<form id="field" method="post" action="submitted"></form>
<script>
const kinds = {
  number: ["Card number", "cardnumber", "cc-number", ""],
  expiry: ["Expiry (MM / YY)", "exp-date", "cc-exp", "MM / YY"],
  code: ["Security code", "cvc", "cc-csc", ""],
};
const [label, name, autocomplete, placeholder] = kinds[new URLSearchParams(location.search).get("kind")] || kinds.number;
document.title = label;
const l = document.createElement("label");
l.htmlFor = "field-input";
l.textContent = label;
const input = document.createElement("input");
Object.assign(input, { id: "field-input", name, type: "text", inputMode: "numeric", autocomplete, placeholder });
input.setAttribute("aria-label", label);
document.getElementById("field").append(l, input);
</script>
</body>
</html>
