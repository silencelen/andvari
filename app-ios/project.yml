name: Andvari
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.29.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: A6J378XKW6
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    # The shared Kotlin core, built by Gradle before Xcode runs (see README.md).
    # The Kotlin core is built for arm64 only, on device and simulator.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    KOTLIN_TARGET[sdk=iphoneos*]: iosArm64
    KOTLIN_TARGET[sdk=iphonesimulator*]: iosSimulatorArm64
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../core/build/bin/$(KOTLIN_TARGET)/releaseFramework
    OTHER_LDFLAGS: $(inherited) -framework AndvariCore -lsqlite3 -lc++
# Explicit, because a project with any shared scheme stops getting one made per target. "Andvari" is what the
# builds use, unchanged; "AndvariUITests" adds the simulator UI tests (app-ios/uitest/README.md).
schemes:
  Andvari:
    build:
      targets:
        Andvari: all
  AndvariUITests:
    build:
      targets:
        Andvari: all
        AndvariUITests: [test]
    test:
      config: Debug
      targets:
        - AndvariUITests
targets:
  Andvari:
    type: application
    platform: iOS
    sources: [Andvari]
    dependencies:
      - target: AndvariSafari
        embed: true
      - target: AndvariAutoFill
        embed: true
    info:
      path: Andvari/Info.plist
      properties:
        CFBundleDisplayName: andvari
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: andvari uses Face ID to unlock your vault.
        NSCameraUsageDescription: andvari uses the camera to scan documents into an item, and to scan a household member's code when you check who they are.
    entitlements:
      path: Andvari/Andvari.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Shared with both extensions: the non-secret session state, the quick-unlock key, the AutoFill snapshot
        # and the save queue (IosStorageConfig). The session's tokens are never there.
        com.apple.security.application-groups: [group.com.silencelen.andvari]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silencelen.andvari
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Distribution"
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: "com.silencelen.andvari AppStore"
  AndvariSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: AndvariSafari/SafariWebExtensionHandler.swift
      # Safari loads manifest.json from the root of the .appex, so these are copied flat.
      # Only icons/ keeps its folder. A root folder called "Resources" also breaks codesign.
      - path: AndvariSafari/web
        excludes: ["icons/**"]
        buildPhase: resources
      - path: AndvariSafari/web/icons
        type: folder
        buildPhase: resources
    info:
      path: AndvariSafari/Info.plist
      properties:
        CFBundleDisplayName: andvari
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: andvari uses Face ID to unlock your vault before it fills a password.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: AndvariSafari/AndvariSafari.entitlements
      properties:
        # The handler reads the app's server origin from here and answers the extension's native message.
        com.apple.security.application-groups: [group.com.silencelen.andvari]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silencelen.andvari.safari
        CODE_SIGN_IDENTITY: "Apple Distribution"
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: "com.silencelen.andvari.safari AppStore"
        # The native handler opens the app's snapshot through the Kotlin core (the same read-only vault as AutoFill),
        # so this target links it, as the base settings say.
  AndvariAutoFill:
    type: app-extension
    platform: iOS
    sources: [AndvariAutoFill]
    info:
      path: AndvariAutoFill/Info.plist
      properties:
        CFBundleDisplayName: andvari
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: andvari uses Face ID to unlock your vault before it fills a password.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesOneTimeCodes: true
              # iOS 26.2: the system offers to save new logins to andvari (queued for the app to confirm).
              SupportsSavePasswordCredentials: true
    entitlements:
      path: AndvariAutoFill/AndvariAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.com.silencelen.andvari]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silencelen.andvari.autofill
        CODE_SIGN_IDENTITY: "Apple Distribution"
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: "com.silencelen.andvari.autofill AppStore"
  # UI tests for the iOS Simulator only (.github/workflows/ios-uitest.yml). Never part of an archive: the
  # Andvari scheme does not build it.
  AndvariUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AndvariUITests]
    dependencies:
      - target: Andvari
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silencelen.andvari.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Andvari
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # The tests drive the app from outside and link none of it, so not the Kotlin core either.
        OTHER_LDFLAGS: ""
