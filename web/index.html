<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Self-contained brand favicon (the ᛅ sigil) + per-scheme chrome tint. Same-origin assets,
         so the strict self-only CSP is satisfied; no external requests. H138: favicon.svg is a
         verbatim copy of assets/brand/andvari-mark.svg and every raster below is rendered from
         it by scripts/gen-brand-icons.sh — never hand-edit one of them. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- H136 (audit 2026-09-13): iOS was covered by the touch icon above, but Chromium's install
         path keys on a manifest, and there was none — so "Add to Home screen" on Android gave a
         household member a generic letter icon named after the URL, opening in a browser tab.
         The manifest is same-origin, so `manifest-src` falls back to the SPA route's
         `default-src 'self'` and no CSP change is needed; Ktor already maps .webmanifest to
         application/manifest+json. No service worker is implied or required — installability
         signals improve without one, and the offline-shell call (H48) stays a separate decision.
         theme_color inside the manifest can only be one value, so it is the dark shell's #14120e
         (which is also the icon field); the two metas below keep the per-scheme browser chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14120e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
    <meta name="description" content="andvari — your household's zero-knowledge password manager." />
    <title>andvari</title>
    <!-- Cut M (v2 #22): pre-hydration shell. Inline <style> is fine under the server CSP
         (style-src allows 'unsafe-inline'; script-src does NOT — so no inline JS here).
         These are literal twins of styles.css --bg/--ink-dim/--serif: this file paints
         frames before the bundle (and its tokens) arrives, so the values are inlined. -->
    <style>
      html { background: #14120e; }
      .boot { display: flex; flex-direction: column; gap: 14px; min-height: 100vh; min-height: 100dvh; align-items: center; justify-content: center; text-align: center; padding: 0 24px; color: #a79c85; font: 15px/1.4 "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; letter-spacing: 0.04em; }
      /* H76 (audit 2026-09-13): the server now sends no-cache on this document and 404s a missing
         hashed asset, so the strand this line answers is rare — but it is not impossible (a proxy,
         an offline-ish cache, a genuinely slow first paint), and when it happens there is no bundle
         running to say anything at all: the tab simply sits on "unsealing…" and the reader's first
         hypothesis is that their vault is broken. One reload fixes every version of it, so say so.
         CSS-only on purpose — the CSP bars inline JS (script-src 'self'), and a delayed reveal
         needs no script. Hidden until it is true: 8 s is well past a cold parse of the bundle. */
      .boot-stuck { max-width: 34em; font-size: 13px; opacity: 0; visibility: hidden; animation: boot-stuck 0s linear 8s forwards; }
      @keyframes boot-stuck { to { opacity: 1; visibility: visible; } }
      @media (prefers-color-scheme: light) {
        html { background: #f4efe4; }
        .boot { color: #6b6047; }
      }
    </style>
    <!-- Forced-theme cold-load FOUC fix: a same-origin, classic (render-blocking) script that
         stamps <html data-theme> from the persisted preference BEFORE first paint. Inline JS is
         barred by the CSP (script-src 'self', not 'unsafe-inline'), so it lives in /public and is
         a faithful twin of applyThemePref/readThemePref in src/ui/useTheme.ts (initTheme re-runs
         the same logic on mount). Must stay classic + before the module bundle so it runs pre-paint. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <!-- No JS = no crypto, no app — say so instead of a permanent blank page. -->
    <noscript>
      <div class="boot">andvari needs JavaScript to unseal your hoard — enable it, then reload.</div>
    </noscript>
    <div id="root">
      <!-- Boot placeholder over the blank first paint; createRoot clears the container,
           so React's first render sweeps this away. Copy mirrors App's loading phase EXACTLY,
           casing included (R06): the two paint in the same spot one after the other, so a
           lower-case placeholder followed by App's sentence-case <Busy> flickers a re-spelling
           at the reader on every cold load. boot-shell.test.ts pins the pair, not the string. -->
      <div class="boot">
        <span>Unsealing…</span>
        <span class="boot-stuck">Still on this screen? Reload the page — that clears it.</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
