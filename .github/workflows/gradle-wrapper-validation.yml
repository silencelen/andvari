# Validates the checked-in gradle-wrapper.jar against Gradle's published checksums —
# the standard mitigation for a committed binary (Scorecard Binary-Artifacts): a
# tampered wrapper jar fails this on every push/PR that could carry one.
name: Gradle wrapper validation

on:
  push:
    branches: [main]
    paths: ["gradle/wrapper/**"]
  pull_request:
    paths: ["gradle/wrapper/**"]
  # Manual trigger. The path filters above mean this only fires when the wrapper
  # actually changes, which is correct but left the control unexercised from its
  # introduction until 2026-08-13 — long enough for its action pin to rot to a
  # SHA that existed in no repository, undetected. Being able to run it on demand
  # is what makes the pin verifiable without faking a wrapper change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
